version: '3.8'

services:
  # ==================================
  # DATABASE (PostgreSQL)
  # ==================================
  db:
    image: postgres:15-alpine
    container_name: qsi_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qsi_africa}
    volumes:
      - db_data:/var/lib/postgresql/data
    # SECURITY: Database port NOT exposed to internet - only accessible within Docker network
    # ports:
    #   - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================================
  # SERVER (Backend)
  # ==================================
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    image: qsidocker2026/qsi-server:latest
    container_name: qsi_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-qsi_africa}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================================
  # NGINX REVERSE PROXY
  # ==================================
  nginx-proxy:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    image: qsidocker2026/qsi-nginx-proxy:latest
    container_name: qsi_proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - client
      - admin-client
      - server

  # ==================================
  # CLIENT (Frontend)
  # ==================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: qsidocker2026/qsi-client:latest
    container_name: qsi_client
    restart: always
    expose: 
      - "80"
    depends_on:
      - server

  # ==================================
  # ADMIN CLIENT
  # ==================================
  admin-client:
    build:
      context: ./admin-client
      dockerfile: Dockerfile
    image: qsidocker2026/qsi-admin-client:latest
    container_name: qsi_admin
    restart: always
    expose: 
      - "80"

volumes:
  db_data:
